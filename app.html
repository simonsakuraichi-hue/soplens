<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOPLens Beta</title>
<style>
:root{--bg:#0b0d10;--panel:#12161c;--text:#f4f7fb;--muted:#9aa6b2;--line:#28323f;--accent:#73d09c;--warn:#f4c96b;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:var(--text)}.wrap{width:min(980px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:999px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{width:100%;background:#0d1116;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px}textarea.field{min-height:190px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#08110d}.secondary{background:#171d25;color:var(--text);border:1px solid var(--line)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}.screen{display:none}.screen.active{display:block}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}.kpi strong{font-size:22px;display:block}.item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}.item p{color:var(--muted);margin:6px 0 0;font-size:13px}.danger{color:var(--danger)}.warn{color:var(--warn)}.doc{background:#0d1116;border:1px solid var(--line);border-radius:14px;padding:18px}.doc li,.doc p{color:#c8d1da;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:#171d25;color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer}@media(max-width:760px){.grid,.kpis{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand">SOPLens</div><div class="badge">Beta • Don't guess. Flag it.</div></div>
<section class="screen active" id="s1"><div class="card"><h1>Start a process</h1><div class="grid"><input id="name" class="field" placeholder="Process name"><input id="dept" class="field" placeholder="Department"><input id="owner" class="field" placeholder="Process owner"><select id="purpose" class="field"><option>Standard work / SOP</option><option>Training</option><option>Audit readiness</option></select></div><div class="actions"><button class="btn secondary" id="demo">Load PP cup demo</button><button class="btn primary" id="next1">Continue →</button></div></div></section>
<section class="screen" id="s2"><div class="card"><h1>Describe the process</h1><p style="color:var(--muted)">Incomplete is okay. Paste the process as it really happens.</p><textarea id="source" class="field" placeholder="Operator checks material, starts heaters, verifies setup..."></textarea><div class="actions"><button class="btn secondary" onclick="show(1)">← Back</button><button class="btn primary" id="analyze">Analyze →</button></div></div></section>
<section class="screen" id="s3"><div class="kpis"><div class="kpi"><strong id="stepsN">0</strong>Steps</div><div class="kpi"><strong id="controlsN">0</strong>Controls</div><div class="kpi"><strong id="gapsN">0</strong>Gaps</div><div class="kpi"><strong id="conf">—</strong>Confidence</div></div><div class="grid"><div class="card"><h2>Detected controls</h2><div id="controls"></div></div><div class="card"><h2>Gap flags</h2><div id="gaps"></div></div></div><div class="card"><h2>Clarifying questions</h2><div id="questions"></div><div class="actions"><button class="btn secondary" onclick="show(2)">← Back</button><button class="btn primary" id="generate">Generate package →</button></div></div></section>
<section class="screen" id="s4"><div class="card"><h1>Process package</h1><div class="tabs"><button class="tab" data-tab="sop">SOP Draft</button><button class="tab" data-tab="map">Process Map</button><button class="tab" data-tab="controls">Control Plan</button><button class="tab" data-tab="training">Training</button><button class="tab" data-tab="open">Open Questions</button></div><div id="output" class="doc"></div><div class="actions"><button class="btn secondary" id="download">Download Markdown</button><button class="btn primary" onclick="location.reload()">Start another</button></div></div></section>
</div>
<script>
const state={meta:{},text:'',steps:[],controls:[],gaps:[],answers:{},tab:'sop'};
const $=id=>document.getElementById(id);
const nameEl=$('name'),deptEl=$('dept'),ownerEl=$('owner'),purposeEl=$('purpose'),sourceEl=$('source'),stepsNEl=$('stepsN'),controlsNEl=$('controlsN'),gapsNEl=$('gapsN'),confEl=$('conf'),controlsEl=$('controls'),gapsEl=$('gaps'),questionsEl=$('questions'),outputEl=$('output');
const demoText='Operator confirms scheduled SKU and correct PP material. Check line clearance. Confirm mold and utilities are ready. Turn on heater zones and bring machine to setup condition. Start at low speed and form initial cups. Inspect appearance, rim and wall formation. Send first article to QC before full production. If first article fails, adjust settings and repeat sample. Once QC approves, increase to normal speed and record startup information. During the run, operator checks quality periodically and escalates abnormal defects.';
function show(n){document.querySelectorAll('.screen').forEach((x,i)=>x.classList.toggle('active',i===n-1));scrollTo(0,0)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('demo').onclick=()=>{nameEl.value='32 oz PP Cup Thermoforming Startup';deptEl.value='Plastic Thermoforming';ownerEl.value='Shift Supervisor';sourceEl.value=demoText};
document.getElementById('next1').onclick=()=>{if(!nameEl.value.trim())return alert('Enter a process name.');state.meta={name:nameEl.value.trim(),dept:deptEl.value.trim(),owner:ownerEl.value.trim(),purpose:purposeEl.value};show(2)};
function analyzeText(t){const parts=t.replace(/\n+/g,' ').split(/(?<=[.!?])\s+/).filter(Boolean);const action=/\b(check|confirm|verify|turn|start|inspect|send|record|adjust|repeat|increase|stop|approve|escalate|form)\w*\b/i;state.steps=parts.filter(x=>action.test(x)).slice(0,14);const controlRx=/\b(qc|quality|inspect|check|verify|approval|approved|limit|range|safety|temperature|pressure|speed|record|first article|escalate|defect|hold)\b/i;state.controls=parts.filter(x=>controlRx.test(x)).slice(0,12);const lc=t.toLowerCase();state.gaps=[];if(!/\d+\s*(°|f\b|c\b|psi|bar|mm|sec|min|%|rpm)|\brange\b|\bminimum\b|\bmaximum\b/.test(lc))state.gaps.push(['High','No measurable operating limits detected','No numeric operating or acceptance range was found.']);if(!/\b(ppe|lockout|loto|safety|hazard|guard)\b/.test(lc))state.gaps.push(['High','Safety requirements are not explicit','No specific PPE, guarding, hazard, or energy-control requirement was found.']);if(!/\b(every \d|hourly|frequency|periodic|interval)\b/.test(lc))state.gaps.push(['Medium','Inspection frequency is vague','Quality checks are mentioned, but exact frequency is not defined.']);if(!/\b(reject|scrap|hold|fail|failed|nonconform)\b/.test(lc))state.gaps.push(['Medium','Failure disposition is unclear','The process does not clearly define what happens to failed output.']);if(!state.meta.owner)state.gaps.push(['Medium','Process owner is missing','A role should own the process and approve changes.']);}
document.getElementById('analyze').onclick=()=>{state.text=sourceEl.value.trim();if(!state.text)return alert('Describe the process first.');analyzeText(state.text);stepsNEl.textContent=state.steps.length;controlsNEl.textContent=state.controls.length;gapsNEl.textContent=state.gaps.length;confEl.textContent=Math.max(40,Math.min(92,55+state.steps.length*3-state.gaps.length*2))+'%';controlsEl.innerHTML=state.controls.map(x=>'<div class="item">'+esc(x)+'</div>').join('')||'<p>No controls detected.</p>';gapsEl.innerHTML=state.gaps.map(g=>'<div class="item"><b class="'+(g[0]=='High'?'danger':'warn')+'">'+g[0]+' — '+esc(g[1])+'</b><p>'+esc(g[2])+'</p></div>').join('');questionsEl.innerHTML=state.gaps.map((g,i)=>'<div class="item"><b>'+esc(g[1])+'</b><input class="field ans" data-k="'+i+'" placeholder="Enter approved information or leave blank"></div>').join('');show(3)};
function packageData(){document.querySelectorAll('.ans').forEach(x=>state.answers[x.dataset.k]=x.value.trim())}
function render(tab){packageData();state.tab=tab;let h='';if(tab==='sop')h='<h2>'+esc(state.meta.name)+'</h2><p><b>Department:</b> '+esc(state.meta.dept||'Not specified')+' • <b>Owner:</b> '+esc(state.meta.owner||'OPEN')+'</p><h3>Procedure</h3><ol>'+state.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><h3>Critical Controls</h3><ul>'+state.controls.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul><p><b>Draft status:</b> Human review required before release.</p>';if(tab==='map')h='<h2>Process Map</h2>'+state.steps.map((s,i)=>'<div class="item"><b>Step '+(i+1)+'</b><p>'+esc(s)+'</p></div>').join('');if(tab==='controls')h='<h2>Control Plan</h2>'+state.controls.map((c,i)=>'<div class="item"><b>Control '+(i+1)+'</b><p>'+esc(c)+'</p></div>').join('');if(tab==='training')h='<h2>Training Checklist</h2><ul>'+state.steps.map(s=>'<li>☐ '+esc(s)+'</li>').join('')+'<li>☐ Explain stop-and-escalate conditions.</li></ul>';if(tab==='open')h='<h2>Open Questions</h2>'+state.gaps.map((g,i)=>'<div class="item"><b>'+esc(g[1])+'</b><p>'+(state.answers[i]?esc(state.answers[i]):'OPEN — '+esc(g[2]))+'</p></div>').join('');outputEl.innerHTML=h}
document.getElementById('generate').onclick=()=>{render('sop');show(4)};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));
document.getElementById('download').onclick=()=>{packageData();const md='# '+state.meta.name+'\n\n## Procedure\n'+state.steps.map((s,i)=>(i+1)+'. '+s).join('\n')+'\n\n## Controls\n'+state.controls.map(c=>'- '+c).join('\n')+'\n\n## Open Gaps\n'+state.gaps.map((g,i)=>'- '+g[1]+': '+(state.answers[i]||g[2])).join('\n')+'\n\nDraft generated by SOPLens Beta. Human review required.';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='soplens-process.md';a.click()}
</script></body></html>
